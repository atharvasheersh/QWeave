name: QWeave checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install package and test dependencies
        run: python -m pip install -c requirements-ci.txt -e '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Run isolated smoke comparison
        run: python -c "from qweave.experiments.smoke import run_smoke; print(run_smoke('run_artifacts/ci_smoke'))"
      - name: Upload smoke records
        uses: actions/upload-artifact@v7
        with:
          name: smoke-records
          path: run_artifacts/ci_smoke/
          if-no-files-found: error
